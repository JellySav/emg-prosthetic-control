name: Continuous Integration - EMG Prosthetic Control

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Instalar Dependencias del Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0 libglib2.0-0

    - name: Instalar Dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar Pruebas con Pytest
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=src --cov-report=xml --cov-report=term-missing

    - name: Subir Artefactos de Pruebas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: junit/test-results.xml
